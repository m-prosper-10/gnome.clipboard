name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: Cargo Audit (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, ui, prefs]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit ${{ matrix.crate }}/Cargo.lock
        run: cargo audit --file ${{ matrix.crate }}/Cargo.lock
